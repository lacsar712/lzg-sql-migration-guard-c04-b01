services:
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: guard123
      POSTGRES_DB: sql_guard
    ports:
      - "54374:5432"
    volumes:
      - guard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard -d sql_guard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 8174
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: guard
      DB_PASSWORD: guard123
      DB_NAME: sql_guard
      # 风险分与通过阈值（详见 README「风险分与通过阈值」）
      RISK_GATE_ENABLED: "false"
      RISK_PASS_THRESHOLD: "70"
      RISK_WEIGHT_ERROR: "40"
      RISK_WEIGHT_WARNING: "10"
      RISK_WEIGHT_INFO: "2"
    ports:
      - "8174:8174"
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: ./seed
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: guard
      DB_PASSWORD: guard123
      DB_NAME: sql_guard
    volumes:
      - ./fixtures:/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "3174:80"
    depends_on:
      - backend

volumes:
  guard_pg_data:
